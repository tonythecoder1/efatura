# Render Blueprint for the FastAPI backend and the Vite frontend.
# See https://render.com/docs/blueprint-spec

services:
  - type: web
    name: efatura
    runtime: python
    plan: free
    region: oregon
    branch: main
    buildCommand: pip install -r requirements.lock
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: API_KEY
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false
      - key: OPENAI_MODEL
        value: gpt-6.1-sol
      - key: CSV_PATH
        value: data/faturas.csv
      - key: MAX_UPLOAD_MB
        value: "20"
      - key: MAX_PAGES
        value: "30"
      - key: OPENAI_TIMEOUT_SECONDS
        value: "120"

  - type: web
    name: efatura-frontend
    runtime: node
    plan: free
    region: oregon
    branch: main
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npx vite preview --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - key: VITE_API_URL
        sync: false
